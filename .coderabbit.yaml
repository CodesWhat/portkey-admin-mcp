# CodeRabbit configuration — portkey-admin-mcp
language: en-US

reviews:
  profile: chill
  auto_review:
    enabled: true
  high_level_summary: true
  collapse_walkthrough: false
  review_status: true
  poem: false
  request_changes_workflow: false

  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/coverage/**"
    - "!**/package-lock.json"
    - "!**/*.lock"
    - "!docs/glama-score/**"
    - "!CHANGELOG.md"

  path_instructions:
    - path: "src/tools/**"
      instructions: |
        MCP tool definitions. Tool names, descriptions, and input schemas are the public API — flag unclear descriptions, missing parameter docs, and breaking schema changes.
    - path: "src/services/**"
      instructions: |
        Portkey Admin API client wrappers. Flag endpoints that don't handle pagination or API errors consistently with the rest.
    - path: "src/schemas/**"
      instructions: |
        Zod schemas shared across tools. Breaking changes here ripple — flag loosened validation.
    - path: "tests/**"
      instructions: |
        Test files. Don't suggest error handling or null checks in test code.

knowledge_base:
  opt_out: false
  learnings:
    scope: local
  issues:
    scope: local
  # Default filePatterns already cover CLAUDE.md / AGENTS.md / .cursorrules
  code_guidelines:
    enabled: true
  web_search:
    enabled: true
  pull_requests:
    scope: local

chat:
  auto_reply: true
