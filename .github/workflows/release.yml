name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to publish as a GitHub Release and to the MCP Registry"
        required: true
        type: string
      manifest_ref:
        description: "Optional ref containing a corrected server.json for an existing release"
        required: false
        type: string

permissions: {}

# One release at a time; a queued release waits rather than cancelling an
# in-flight publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      ci_ref: ${{ steps.resolve.outputs.ci_ref }}
      manifest_ref: ${{ steps.resolve.outputs.manifest_ref }}
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require protected-main ancestry
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          MANIFEST_REF: ${{ github.event.inputs.manifest_ref }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to publish non-semver tag: $tag" >&2
            exit 1
          fi

          git fetch origin main --tags --force
          tag_commit="$(git rev-list -n 1 "refs/tags/$tag")"
          if [[ -z "$tag_commit" ]] || ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag $tag is not reachable from protected main" >&2
            exit 1
          fi

          ci_ref="$tag"
          manifest_ref="$MANIFEST_REF"
          if [[ -n "$manifest_ref" ]]; then
            git fetch origin "$manifest_ref"
            manifest_commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
            if ! git merge-base --is-ancestor "$manifest_commit" origin/main; then
              echo "Manifest ref is not reachable from protected main: $manifest_ref" >&2
              exit 1
            fi
            ci_ref="$manifest_ref"
          fi

          {
            echo "tag=$tag"
            echo "ci_ref=$ci_ref"
            echo "manifest_ref=$manifest_ref"
          } >>"$GITHUB_OUTPUT"

  ci:
    needs: release-ref
    # Gate the release on the full CI suite for the tagged commit, so a broken
    # tag never produces a GitHub Release or an MCP Registry entry.
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release-ref.outputs.ci_ref }}
    permissions:
      contents: read
      # ci.yml's dependency-review job declares this; it skips on release runs
      # but the grant keeps the workflow_call permission check satisfied.
      pull-requests: read
      # No id-token here: ci.yml's reusable jobs (checks, actionlint) request no
      # id-token, so the release gate doesn't need to grant it. The OIDC-bearing
      # Qlty coverage job lives outside the reusable path and only runs on
      # push/PR. See issue #60.
    secrets:
      PORTKEY_API_KEY_STAGING: ${{ secrets.PORTKEY_API_KEY_STAGING }}

  github-release:
    needs: [release-ref, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # gh release create
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Public repo: the tag fetch below works anonymously; gh uses GH_TOKEN.
          persist-credentials: false

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to publish non-semver tag: $tag" >&2
            exit 1
          fi

          git fetch --tags --force
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag does not exist on the remote: $tag" >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release already exists for $tag; nothing to do."
            exit 0
          fi

          # Use the tag's CHANGELOG.md section as the release body; gh prepends
          # it to the auto-generated notes (PR list + compare link). Read the
          # file from the tag, not the checkout, so dispatch backfills get the
          # right version's notes.
          notes_file="$(mktemp)"
          git show "refs/tags/${tag}:CHANGELOG.md" 2>/dev/null \
            | awk -v ver="${tag#v}" '
                index($0, "## [" ver "]") == 1 { found=1; next }
                found && (/^## / || /^\[[^]]*\]: /) { exit }
                found { print }
              ' >"$notes_file" || true

          args=(--verify-tag --generate-notes --title "Release $tag")
          if grep -q '[^[:space:]]' "$notes_file"; then
            args+=(--notes-file "$notes_file")
          else
            echo "No CHANGELOG.md section found for ${tag#v}; using generated notes only."
          fi
          if [[ "$tag" == *-* ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi

          gh release create "$tag" "${args[@]}"

  package-npm:
    needs: [release-ref, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      already_published: ${{ steps.publication.outputs.already_published }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_dispatch inputs are untrusted to the runner. Execute
          # dependencies only from the commit GitHub selected for this run.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to publish non-semver tag: $tag" >&2
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=${tag#v}"
          } >>"$GITHUB_OUTPUT"

      - name: Check npm publication state
        id: publication
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail

          view_error="$(mktemp)"
          if npm view "portkey-admin-mcp@${VERSION}" version >/dev/null 2>"$view_error"; then
            echo "portkey-admin-mcp@${VERSION} is already on npm; skipping package execution."
            echo "already_published=true" >>"$GITHUB_OUTPUT"
          elif grep -Eq 'E404|404 Not Found' "$view_error"; then
            echo "already_published=false" >>"$GITHUB_OUTPUT"
          else
            cat "$view_error" >&2
            echo "Unable to determine whether portkey-admin-mcp@${VERSION} exists" >&2
            exit 1
          fi

      - name: Verify release source
        if: steps.publication.outputs.already_published != 'true'
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail

          git fetch origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" --force
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          trusted_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if [[ "$tag_commit" != "$trusted_commit" ]]; then
            echo "Refusing to build $RELEASE_TAG because it does not match the trusted workflow commit $GITHUB_SHA" >&2
            echo "Dispatch an unpublished release with --ref $RELEASE_TAG so GitHub supplies the tagged commit." >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "$VERSION" ]]; then
            echo "package.json ($package_version) does not match tag v$VERSION" >&2
            exit 1
          fi

      - name: Install dependencies without lifecycle scripts
        if: steps.publication.outputs.already_published != 'true'
        run: npm ci --ignore-scripts

      - name: Build package
        if: steps.publication.outputs.already_published != 'true'
        run: npm run build

      - name: Pack package without lifecycle scripts
        if: steps.publication.outputs.already_published != 'true'
        id: pack
        run: |
          set -euo pipefail
          tarball="$(npm pack --ignore-scripts --silent)"
          if [[ ! -f "$tarball" || "$tarball" != *.tgz ]]; then
            echo "npm pack did not produce exactly one tarball: $tarball" >&2
            exit 1
          fi
          echo "tarball=$tarball" >>"$GITHUB_OUTPUT"

      - name: Smoke-test packed package
        if: steps.publication.outputs.already_published != 'true'
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/smoke-package.mjs "$TARBALL"

      - name: Upload package artifact
        if: steps.publication.outputs.already_published != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    needs: [release-ref, ci, package-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      # This job receives OIDC only after dependency execution and packaging
      # have completed in package-npm.
      id-token: write
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to publish non-semver tag: $tag" >&2
            exit 1
          fi

          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"

      - name: Download package artifact
        if: needs.package-npm.outputs.already_published != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: package

      - name: Verify package artifact
        if: needs.package-npm.outputs.already_published != 'true'
        id: artifact
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find package -maxdepth 1 -type f -name '*.tgz' -print)
          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "Expected exactly one npm tarball; found ${#tarballs[@]}" >&2
            exit 1
          fi

          # Resolve to an absolute path. `npm publish` parses a bare relative
          # arg like "package/foo.tgz" as a GitHub org/repo shorthand and tries
          # to git-clone it (fatal: Permission denied); an absolute path is
          # unambiguously treated as a local tarball.
          tarball="$(realpath "${tarballs[0]}")"
          tarball_version="$(tar -xOf "$tarball" package/package.json | node -e 'let data=""; process.stdin.on("data", c => data += c).on("end", () => process.stdout.write(JSON.parse(data).version))')"
          if [[ "$tarball_version" != "$VERSION" ]]; then
            echo "Tarball version ($tarball_version) does not match tag v$VERSION" >&2
            exit 1
          fi
          echo "tarball=$tarball" >>"$GITHUB_OUTPUT"

      - name: Publish to npm
        if: needs.package-npm.outputs.already_published != 'true'
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          set -euo pipefail

          if npm view "portkey-admin-mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "portkey-admin-mcp@${VERSION} is already on npm; nothing to do."
            exit 0
          fi

          # Prereleases (any version containing "-") publish to the "rc"
          # dist-tag so `npm i portkey-admin-mcp` stays on the last stable.
          dist_tag="latest"
          if [[ "$VERSION" == *-* ]]; then
            dist_tag="rc"
          fi
          echo "Publishing ${VERSION} to dist-tag: ${dist_tag}"

          # Authenticates via OIDC trusted publishing. The tarball was built in
          # package-npm, and lifecycle scripts remain disabled here.
          npm publish "$TARBALL" \
            --ignore-scripts \
            --provenance \
            --access public \
            --tag "$dist_tag"

  publish-registry:
    needs: [release-ref, ci, publish-npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A manifest-only correction can republish an existing version without
          # moving its immutable release tag or republishing its npm artifact.
          ref: ${{ needs.release-ref.outputs.manifest_ref || needs.release-ref.outputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Resolve tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to publish non-semver tag: $tag" >&2
            exit 1
          fi

          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"

      - name: Verify server.json matches tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail

          server_version="$(node -p "require('./server.json').version")"
          package_version="$(node -p "require('./server.json').packages[0].version")"
          if [[ "$server_version" != "$VERSION" || "$package_version" != "$VERSION" ]]; then
            echo "server.json ($server_version / package $package_version) does not match tag v$VERSION" >&2
            exit 1
          fi

      - name: Wait for npm package
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 20); do
            if npm view "portkey-admin-mcp@${VERSION}" version >/dev/null 2>&1; then
              echo "Found portkey-admin-mcp@${VERSION} on npm"
              exit 0
            fi
            echo "Waiting for portkey-admin-mcp@${VERSION} on npm (attempt ${attempt}/20)..."
            sleep 15
          done

          echo "Timed out waiting for portkey-admin-mcp@${VERSION} on npm" >&2
          exit 1

      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.7.9
          MCP_PUBLISHER_SHA256: ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            -o "$archive"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" mcp-publisher

      - name: Authenticate with the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
