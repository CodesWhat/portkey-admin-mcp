name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (used by the release workflow for tag backfills)
        required: false
        type: string
    secrets:
      PORTKEY_API_KEY_STAGING:
        description: Optional Portkey staging key for the smoke test
        required: false

# Rapid successive pushes to the same branch cancel the superseded run.
# event_name is part of the key so a release-gate run (workflow_call under a
# tag or dispatch ref) never shares a group with — and can't be cancelled by —
# a concurrent push to main.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    # Validates workflow files themselves; an invalid workflow otherwise only
    # surfaces as a "workflow file issue" after it's already on main.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Run actionlint
        run: |
          set -euo pipefail
          # Commit SHA of the v1.7.12 tag — raw.githubusercontent by tag is mutable.
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color

  dependency-review:
    # Flags known-vulnerable or malicious dependency changes on PRs (Renovate's
    # included). PR-only: the action needs a PR diff, and the release-gate
    # workflow_call run skips it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No id-token here. Reusable-workflow permission validation is a single
    # whole-workflow preflight: release.yml gates on this file via
    # workflow_call, and if ANY job in ci.yml requested a permission the release
    # caller didn't grant, the entire Release run is rejected at startup (zero
    # jobs, no logs) — the silent failure issue #60 exists to prevent. The Qlty
    # coverage upload needs OIDC (id-token), so it lives entirely outside this
    # file, in coverage.yml, which release.yml never calls.
    permissions:
      contents: read
    services:
      redis:
        image: redis:8.8-alpine@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Knip (unused exports/deps)
        run: npm run knip

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:tests

      - name: Unit tests
        # Enforces the OpenSSF Silver 80% line-coverage gate. The lcov report it
        # produces is uploaded to Qlty by the separate coverage.yml workflow, not
        # here — see issue #60 for why coverage publishing lives outside the
        # reusable CI that release.yml gates on.
        run: npm run test:coverage:qlty

      - name: Redis event-store integration
        env:
          MCP_REDIS_TEST_URL: redis://127.0.0.1:6379
        run: npm run test:redis

      - name: Build
        run: npm run build

      - name: Verify Glama TDQS definition quality
        run: npm run verify:tool-quality

      - name: E2E tests
        run: npm run test:e2e

      - name: Verify README tool inventory
        run: npm run verify:readme-tools

      - name: Optional smoke test (requires secret)
        env:
          PORTKEY_API_KEY: ${{ secrets.PORTKEY_API_KEY_STAGING }}
        run: |
          if [ -z "$PORTKEY_API_KEY" ]; then
            echo "PORTKEY_API_KEY_STAGING not set; skipping smoke test."
            exit 0
          fi
          npm run smoke
