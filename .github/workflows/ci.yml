name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Knip (unused exports/deps)
        run: npm run knip

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npm run test:e2e

      - name: Verify README tool inventory
        run: npm run verify:readme-tools

      - name: Optional smoke test (requires secret)
        env:
          PORTKEY_API_KEY: ${{ secrets.PORTKEY_API_KEY_STAGING }}
        run: |
          if [ -z "$PORTKEY_API_KEY" ]; then
            echo "PORTKEY_API_KEY_STAGING not set; skipping smoke test."
            exit 0
          fi
          npm run smoke
