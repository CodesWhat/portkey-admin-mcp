name: Auto Tag Release

# Cuts the release tag automatically when a version bump lands on main.
# The tag then flows through the Release workflow (CI gate, npm publish via
# OIDC trusted publishing, GitHub Release, MCP Registry).

on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions: {}

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      created: ${{ steps.tag.outputs.created }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        # Persisted credentials are required here: this job pushes the tag.
        # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag new version
        id: tag
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to tag non-semver version: $version" >&2
            exit 1
          fi

          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists; nothing to do."
            {
              echo "created=false"
              echo "tag=$tag"
            } >>"$GITHUB_OUTPUT"
            exit 0
          fi

          server_version="$(node -p "require('./server.json').version")"
          server_pkg_version="$(node -p "require('./server.json').packages[0].version")"
          if [[ "$server_version" != "$version" || "$server_pkg_version" != "$version" ]]; then
            echo "server.json ($server_version / package $server_pkg_version) does not match package.json ($version); not tagging." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

          {
            echo "created=true"
            echo "tag=$tag"
          } >>"$GITHUB_OUTPUT"

  dispatch:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch Release at the immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag" -f tag="$tag"
