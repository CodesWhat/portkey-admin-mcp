name: Coverage

# Publishes test coverage to Qlty. Deliberately separate from ci.yml: it needs
# id-token (OIDC) for Qlty's trusted upload, and ci.yml is reused by release.yml
# via workflow_call, where reusable-workflow permission validation is a single
# whole-workflow preflight — any id-token request inside ci.yml would be checked
# against (and exceed) the release caller's grant and reject the whole Release
# run at startup. Keeping the OIDC-bearing job in its own workflow that
# release.yml never calls removes that coupling entirely. See issue #60.
#
# The OpenSSF Silver 80% line-coverage gate is enforced by ci.yml's required
# `checks` job (npm run test:coverage:qlty); this workflow only uploads the
# report, so a Qlty outage can never fail a required check.

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Two jobs so no dependency or repository code runs while an OIDC credential is
# available. `test` runs `npm ci` (lifecycle scripts on) and the branch's test
# code with no id-token. `upload` holds id-token: write but installs nothing and
# runs nothing from the repo: it downloads the lcov artifact and hands it to the
# pinned Qlty action. It does check the repo out, because the Qlty CLI resolves
# report paths and validates them against the working tree; checkout alone
# executes nothing. This mirrors release.yml's package-npm / publish-npm split.

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests with coverage
        run: npm run test:coverage:qlty

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 1
          if-no-files-found: error

  upload:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # Checkout only: no Node, no npm, nothing from the repo is executed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-lcov
          path: coverage

      - name: Upload coverage to Qlty
        uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
        with:
          oidc: true
          files: coverage/lcov.info
