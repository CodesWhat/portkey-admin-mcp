name: "Security: OpenSSF Scorecard"
run-name: >-
  ${{
    github.event_name == 'branch_protection_rule' && 'Security: OpenSSF Scorecard - Branch protection changed' ||
    github.event_name == 'schedule' && 'Security: OpenSSF Scorecard - Weekly schedule' ||
    format('Security: OpenSSF Scorecard - {0}', github.ref_name)
  }}

on:
  push:
    branches:
      - main
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 1"

permissions: read-all

jobs:
  analysis:
    name: "Security: Scorecard Analysis"
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.deps.dev:443
            api.github.com:443
            api.osv.dev:443
            api.scorecard.dev:443
            auth.docker.io:443
            cgr.dev:443
            fulcio.sigstore.dev:443
            github.com:443
            index.docker.io:443
            oss-fuzz-build-logs.storage.googleapis.com:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            www.bestpractices.dev:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
